[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intrusion-detec-sys"
version = "1.0.0"
description = "Defensive network and host intrusion detection system with a live dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Igor Kuchenbecker" }]
keywords = ["ids", "security", "detection-engineering", "soc", "network-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5,<3",
    "flask>=3.0,<4",
    "rich>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5", "ruff>=0.6,<0.7"]

[project.scripts]
ids = "ids.cli.commands:main"

[project.urls]
Repository = "https://github.com/igorkuchenbecker/intrusion-detec-sys"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ids.dashboard" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]
ignore = [
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D213",  # conflicts with D212 (multi-line summary on first line)
    "D105",  # magic methods are documented by their standard behaviour
    "D107",  # __init__ is covered by the class docstring
    "N818",  # exception names are clear and rooted at a single IDSError base
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
